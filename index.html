<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sasha Ranked - Alexandra Trusova Fan Challenge</title>
    <script src="https://cdn.jsdelivr.net/npm/react@18/umd/react.production.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #0b0f19;
            color: #f3f4f6;
        }
        .cinzel {
            font-family: 'Cinzel', serif;
        }
        .glass-panel {
            background: rgba(17, 24, 39, 0.75);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(239, 68, 68, 0.2);
        }
        .glow-red {
            box-shadow: 0 0 25px rgba(239, 68, 68, 0.3);
        }
    </style>
</head>
<body class="min-h-screen bg-gradient-to-br from-gray-950 via-red-950/20 to-gray-950 flex flex-col justify-between">
    <div id="root"></div>

    <script type="text/babel">
        function App() {
            const [started, setStarted] = React.useState(false);
            const [currentTier, setCurrentTier] = React.useState(0);
            const [selectedAnswers, setSelectedAnswers] = React.useState({});
            const [result, setResult] = React.useState(null);

            const tiers = [
                {
                    name: "Quad Queen (四周跳女王)",
                    badge: "👑🔥",
                    desc: "拥有统治冰场的绝对实力与永不言弃的四周跳之魂！",
                    color: "text-red-500 border-red-500/50 bg-red-950/30"
                },
                {
                    name: "Rocket Sasha (烈焰火箭)",
                    badge: "🚀💫",
                    desc: "速度与激情的化身，每一次滑行都燃烧着对冰雪的狂热！",
                    color: "text-orange-400 border-orange-500/50 bg-orange-950/30"
                },
                {
                    name: "Ice Artist (冰上艺术家)",
                    badge: "⛸️✨",
                    desc: "兼具力量与美感，用冰刀在冰面上刻画出最极致的浪漫。",
                    color: "text-blue-400 border-blue-500/50 bg-blue-950/30"
                }
            ];

            const questions = [
                {
                    title: "当你在冰面上迎风起跳时，你最渴望的感受是？",
                    options: [
                        { text: "挑战物理极限，完成高难度四周跳的震撼！", tier: 0 },
                        { text: "像火箭一样全速冲刺，享受风驰电掣的自由！", tier: 1 },
                        { text: "将情感融入每一个旋转，全场为之屏息。", tier: 2 }
                    ]
                },
                {
                    title: "面对逆境和严苛的评分，你的第一反应是？",
                    options: [
                        { text: "不服输！用更高难度的动作直接回击！", tier: 0 },
                        { text: "保持炽热的初心，走自己的路，让别人说去。", tier: 1 },
                        { text: "用优雅与坚韧的姿态证明真正的实力。", tier: 2 }
                    ]
                },
                {
                    title: "选择一项最能代表你个人特质的元素：",
                    options: [
                        { text: "烈火红发与永不熄灭的战斗之魂", tier: 0 },
                        { text: "充满力量感的爆发力与速度", tier: 1 },
                        { text: "对花样滑冰极致纯粹的热爱", tier: 2 }
                    ]
                }
            ];

            const handleSelect = (qIndex, tierIndex) => {
                setSelectedAnswers({...selectedAnswers, [qIndex]: tierIndex});
            };

            const calculateResult = () => {
                const counts = [0, 0, 0];
                Object.values(selectedAnswers).forEach(t => counts[t]++);
                const maxIndex = counts.indexOf(Math.max(...counts));
                setResult(tiers[maxIndex]);
            };

            return (
                <div className="container mx-auto px-4 py-8 max-w-2xl flex-grow flex flex-col justify-center">
                    <div className="text-center mb-8">
                        <h1 className="cinzel text-3xl md:text-5xl font-extrabold text-red-500 mb-2 tracking-wider">
                            SASHA RANKED
                        </h1>
                        <p className="text-gray-400 text-sm">Alexandra Trusova Fan Challenge • Created by Rachel Blue</p>
                    </div>

                    {!started ? (
                        <div className="glass-panel p-8 rounded-2xl text-center glow-red">
                            <div className="text-5xl mb-4">⛸️🔥</div>
                            <h2 className="text-xl font-bold mb-4">准备好接受特鲁索娃风格的冰雪排位测试了吗？</h2>
                            <p className="text-gray-300 text-sm mb-6">探索你在冰迷世界中的专属段位，释放你的四周跳之魂！</p>
                            <button 
                                onClick={() => setStarted(true)}
                                className="bg-red-600 hover:bg-red-700 text-white font-bold py-3 px-8 rounded-full transition-all duration-300 transform hover:scale-105 shadow-lg shadow-red-600/30">
                                开始挑战
                            </button>
                        </div>
                    ) : !result ? (
                        <div className="glass-panel p-6 md:p-8 rounded-2xl glow-red">
                            <div className="mb-6">
                                <span className="text-xs uppercase tracking-widest text-red-400 font-semibold">Question {currentTier + 1} / {questions.length}</span>
                                <h3 className="text-lg md:text-xl font-bold mt-2">{questions[currentTier].title}</h3>
                            </div>
                            <div className="space-y-3">
                                {questions[currentTier].options.map((opt, idx) => (
                                    <button
                                        key={idx}
                                        onClick={() => handleSelect(currentTier, opt.tier)}
                                        className={`w-full text-left p-4 rounded-xl border transition-all duration-200 ${
                                            selectedAnswers[currentTier] === opt.tier 
                                                ? 'border-red-500 bg-red-950/50 text-white' 
                                                : 'border-gray-800 bg-gray-900/50 hover:border-gray-700 text-gray-300'
                                        }`}>
                                        {opt.text}
                                    </button>
                                ))}
                            </div>
                            <div className="mt-8 flex justify-between">
                                {currentTier > 0 && (
                                    <button 
                                        onClick={() => setCurrentTier(currentTier - 1)}
                                        className="px-6 py-2 rounded-lg bg-gray-800 hover:bg-gray-700 text-sm text-gray-300">
                                        上一题
                                    </button>
                                )}
                                <button 
                                    disabled={selectedAnswers[currentTier] === undefined}
                                    onClick={() => {
                                        if (currentTier < questions.length - 1) {
                                            setCurrentTier(currentTier + 1);
                                        } else {
                                            calculateResult();
                                        }
                                    }}
                                    className={`ml-auto px-6 py-2 rounded-lg font-bold text-sm ${
                                        selectedAnswers[currentTier] !== undefined 
                                            ? 'bg-red-600 hover:bg-red-700 text-white shadow-md shadow-red-600/20' 
                                            : 'bg-gray-800 text-gray-500 cursor-not-allowed'
                                    }`}>
                                    {currentTier === questions.length - 1 ? '查看排位结果' : '下一题'}
                                </button>
                            </div>
                        </div>
                    ) : (
                        <div className="glass-panel p-8 rounded-2xl text-center glow-red animate-fade-in">
                            <span className="text-xs uppercase tracking-widest text-red-400 font-semibold">Your Ranked Tier</span>
                            <div className="text-6xl my-4">{result.badge}</div>
                            <h2 className={`cinzel text-2xl md:text-3xl font-bold p-3 rounded-xl border mb-4 ${result.color}`}>
                                {result.name}
                            </h2>
                            <p className="text-gray-300 mb-8 leading-relaxed">{result.desc}</p>
                            <button 
                                onClick={() => {
                                    setStarted(false);
                                    setCurrentTier(0);
                                    setSelectedAnswers({});
                                    setResult(null);
                                }}
                                className="bg-red-600 hover:bg-red-700 text-white font-bold py-3 px-8 rounded-full transition-all duration-300 shadow-lg shadow-red-600/30">
                                再次测定排位
                            </button>
                        </div>
                    )}
                </div>
            );
        }

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
    <footer className="text-center py-4 text-xs text-gray-600">
        © Alexandra Trusova Fan Community. Designed by Rachel Blue.
    </footer>
</body>
</html>
